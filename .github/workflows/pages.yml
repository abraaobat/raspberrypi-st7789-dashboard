name: Deploy landing page to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'scripts/validate_site.mjs'
      - 'scripts/validate_site_images.py'
      - 'scripts/validate_site_browser.mjs'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate landing page
        run: node scripts/validate_site.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate original images and PIX QR
        run: |
          python -m pip install "Pillow==12.3.0"
          python scripts/validate_site_images.py
      - name: Install isolated browser verification
        run: |
          npm install --prefix "${{ runner.temp }}/st7789-browser" --no-save --package-lock=false playwright@1.62.1
          "${{ runner.temp }}/st7789-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Validate desktop and mobile image proportions
        env:
          ST7789_PLAYWRIGHT_PATH: ${{ runner.temp }}/st7789-browser/node_modules/playwright/index.mjs
          ST7789_SCREENSHOTS: ${{ runner.temp }}/st7789-screenshots
        run: |
          python -m http.server 8092 --directory site &
          site_preview_pid=$!
          trap 'kill "$site_preview_pid"' EXIT
          curl --retry 8 --retry-connrefused --retry-delay 1 --fail --silent http://127.0.0.1:8092/ > /dev/null
          node scripts/validate_site_browser.mjs http://127.0.0.1:8092/
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload landing page artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install "Pillow==12.3.0" "Flask>=3.1,<4" "waitress>=3.0,<4"
      - name: Compile sources
        run: python -m compileall -q dashboard bench_display.py web_app.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
